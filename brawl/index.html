<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b6cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>英雄大乱斗</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<!-- lobby -->
<div id="lobby">
  <div class="lbLeft">
    <h1>英雄大乱斗</h1>
    <div class="sub">派对吃鸡 · 最后一个站着的赢</div>
    <div id="trophyTotal">🏆 0</div>
    <div id="mapInfo">本局地图：</div>
    <div id="selInfo"><div id="selName"></div><div id="selRole"></div><div id="selDesc"></div><div id="selStats"></div></div>
  </div>
  <div class="lbRight">
    <div class="ttl">选择你的英雄</div>
    <div id="cards"></div>
    <div class="row"><span>模式</span><div class="seg" id="segM"><button data-m="party">派对吃鸡</button><button data-m="solo">经典单人</button><button data-m="duo">经典双人</button></div></div>
    <div class="row" id="rowN"><span>人数</span><div class="seg" id="segN"><button data-n="10">10人</button><button data-n="13">13人</button><button data-n="16" class="on">16人</button></div></div>
    <div class="row hidden" id="rowMet"><span>随机事件</span><div class="seg" id="segMet"><button data-v="1">开</button><button data-v="0">关</button></div></div>
    <div class="row"><span>难度</span><div class="seg" id="segD"><button data-d="0">轻松</button><button data-d="1" class="on">普通</button><button data-d="2">高手</button></div></div>
    <div class="acts"><button id="btnPlay">开 战 !</button></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <canvas id="mini" width="110" height="110"></canvas>
  <div id="top"><div id="alive">剩余英雄：10</div><div id="zoneT"></div></div>
  <div id="mapBan"></div>
  <div id="kfeed"></div>
  <div id="cmsg"></div>
  <div id="gear"><span id="gCube">⚡0</span><span id="gArmor" class="lv0">甲0</span><span id="gHelm" class="lv0">盔0</span></div>
  <div id="stickL"><div class="base"></div><div class="knob"></div></div>
  <div id="btnAtk" class="abtn"><div class="knob"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="none" stroke="#1a1022" stroke-width="5"/><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M20 3v9M20 28v9M3 20h9M28 20h9" stroke="#1a1022" stroke-width="5" stroke-linecap="round"/><path d="M20 4v7M20 29v7M4 20h7M29 20h7" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="20" r="2.6" fill="#fff" stroke="#1a1022" stroke-width="1.5"/></svg></div></div>
  <div id="btnSup" class="abtn"><div class="track"></div><div class="ring"></div><div class="knob"><svg viewBox="0 0 40 40"><path d="M20 2l4.2 9.6 10-4-4 10 9.6 4.2-9.6 4.2 4 10-10-4L20 38l-4.2-9.6-10 4 4-10L.2 20l9.6-4.2-4-10 10 4z" fill="#ffd23f" stroke="#1a1022" stroke-width="2.4" stroke-linejoin="round"/><circle cx="20" cy="20" r="7.5" fill="#ff6b3d" stroke="#1a1022" stroke-width="2.2"/><path d="M17 16.5l6 3.5-6 3.5z" fill="#fff4c2"/></svg></div><div class="pct">0%</div></div>
  <button id="btnJump" class="hidden">跳 伞</button>
  <button id="btnGad" title="冲刺道具 (Q)"><svg viewBox="0 0 40 40"><path d="M6 13h11M3 20h13M6 27h11" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/><path d="M19 9l14 11-14 11 3.5-11z" fill="#9be8ff" stroke="#1a1022" stroke-width="2.4" stroke-linejoin="round"/></svg><b>3</b></button>
  <button id="btnEmo" title="表情 (T)"><svg viewBox="0 0 40 40"><path d="M8 6h24a6 6 0 0 1 6 6v12a6 6 0 0 1-6 6H18l-7 6v-6H8a6 6 0 0 1-6-6V12a6 6 0 0 1 6-6z" fill="#fff" stroke="#1a1022" stroke-width="2.6" stroke-linejoin="round"/><circle cx="13" cy="18" r="2.6" fill="#1a1022"/><circle cx="20" cy="18" r="2.6" fill="#1a1022"/><circle cx="27" cy="18" r="2.6" fill="#1a1022"/></svg></button>
  <div id="hint"></div>
</div>
<div id="tbtns"><button id="tFull" title="横屏/全屏">⤢</button><button id="tExit" title="退出/暂停">✕</button></div>

<div id="pause" class="hidden"><div class="box"><h2>暂停</h2><button id="pResume">继续游戏</button><button id="pFull" class="ghost">⤢ 横屏/全屏</button><button id="pHome" class="ghost">返回主页</button></div></div>
<div id="end" class="hidden"><div class="box"><div id="endRank"></div><div id="endTrophy"></div><div id="endSub"></div><div id="endList"></div><div class="acts"><button id="eAgain">再来一局</button><button id="eHome" class="ghost">返回主页</button></div></div></div>
<div id="rotHint"><div class="ph"></div><div>横屏游玩效果更好</div><button id="btnRot" class="ghost">⤢ 切换横屏</button><button id="btnRotNo" class="ghost">就竖着玩</button></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
