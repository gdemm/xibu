<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>拼拼豆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:#fdf3e7;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#4a3a2e;overflow:hidden;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:6px;padding:8px 2px 6px}
header h1{font-size:20px;letter-spacing:2px;color:#e86a6a;flex:1;white-space:nowrap}
header h1 span{color:#5bb3e6}
.tb{border:0;border-radius:10px;width:34px;height:34px;font-size:18px;background:#fff;color:#4a3a2e;box-shadow:0 2px 0 #e6d3bd}
.tb.x{background:#e74c3c;color:#fff;box-shadow:0 2px 0 #a83224;font-weight:bold}
#bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-bottom:6px}
select,.btn{font:inherit;font-size:14px;border:0;border-radius:10px;padding:7px 10px;background:#fff;color:#4a3a2e;box-shadow:0 2px 0 #e6d3bd}
.btn.on{background:#ffd76a;box-shadow:0 2px 0 #d9a92c}
.btn.hot{background:#ff8f6b;color:#fff;box-shadow:0 2px 0 #c9603f}
#prog{font-size:13px;margin-left:auto;color:#8a705a}
#wrap{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;border-radius:14px}
#zoom{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;gap:6px;z-index:2}
#zoom button{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 0 #e6d3bd;font-size:20px;color:#4a3a2e}
#ref{position:absolute;left:6px;top:6px;z-index:3;background:#fff;border-radius:10px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.18);display:none;text-align:center;font-size:10px;color:#8a705a}
#ref canvas{display:block;width:84px;height:84px;image-rendering:pixelated;border-radius:6px}
#ref.big canvas{width:200px;height:200px}
#zhint{position:absolute;left:8px;bottom:8px;font-size:11px;color:#a08a74;background:rgba(255,255,255,.8);padding:2px 8px;border-radius:10px;z-index:2;pointer-events:none}
canvas#board{position:absolute;left:0;top:0;touch-action:none;border-radius:14px;box-shadow:0 4px 0 #c9b6a0,0 6px 18px rgba(0,0,0,.12);background:#f4f4f2}
#tools{display:flex;gap:6px;padding:6px 0;justify-content:space-between}
#tools .btn{flex:1;padding:6px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;white-space:nowrap;min-width:0}
#tools .btn b{font-size:18px;font-weight:normal}
#pal{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;padding:4px 2px 10px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid rgba(0,0,0,.08);position:relative}
.sw::after{content:"";position:absolute;inset:30%;border-radius:50%;background:rgba(255,255,255,.5)}
.sw.sel{outline:3px solid #4a3a2e;outline-offset:1px}
.sw .n{position:absolute;right:-4px;top:-6px;font-size:9px;background:#4a3a2e;color:#fff;border-radius:6px;padding:0 3px;display:none}
.sw.need .n{display:block}
#msk{position:fixed;inset:0;background:rgba(40,25,15,.55);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#msk.show{display:flex}
.card{background:#fff8ef;border-radius:18px;padding:16px;max-width:420px;width:100%;text-align:center;max-height:92vh;overflow-y:auto}
.card h2{font-size:20px;margin-bottom:8px;color:#e86a6a}
.card canvas{max-width:100%;border-radius:10px;margin:8px 0;background:#fff}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
#pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
#pick div{background:#fff;border-radius:12px;padding:6px;box-shadow:0 2px 0 #e6d3bd;font-size:13px}
#pick canvas{width:100%;image-rendering:pixelated;margin:0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#4a3a2e;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>拼<span>拼</span>豆</h1>
    <button class="tb" id="fs" title="全屏">⤢</button>
    <button class="tb x" id="quit" title="退出">✕</button>
  </header>
  <div id="bar">
    <button class="btn" id="bPat">🧩 图案</button>
    <button class="btn" id="bFree">✏️ 自由</button>
    <select id="size"><option value="16">16×16</option><option value="24">24×24</option><option value="29" selected>29×29</option><option value="38">38×38</option></select>
    <button class="btn" id="bImg">🖼 照片转豆</button>
    <button class="btn on" id="bSmart" title="图案模式下自动用对的颜色">🪄 智能笔</button>
    <button class="btn" id="bAuto">▶ 自动拼</button>
    <span id="prog"></span>
  </div>
  <div id="wrap"><canvas id="board"></canvas><div id="zoom"><button id="zin">＋</button><button id="zout">－</button><button id="zfit" style="font-size:15px">⊡</button></div><div id="ref"><canvas id="refc"></canvas><span id="reft">参考图 · 点我放大</span></div><div id="zhint">双指拖动/缩放</div></div>
  <div id="tools">
    <button class="btn on" data-t="pen"><b>🫘</b>放豆</button>
    <button class="btn" data-t="erase"><b>🧽</b>拿掉</button>
    <button class="btn" data-t="fill"><b>🪣</b>填充</button>
    <button class="btn" data-t="pick"><b>💧</b>取色</button>
    <button class="btn" id="undo"><b>↶</b>撤销</button>
    <button class="btn" id="clear"><b>🗑</b>清空</button>
    <button class="btn hot" id="iron"><b>♨️</b>熨烫</button>
  </div>
  <div id="pal"></div>
</div>
<div id="msk"><div class="card" id="card"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

function buildPal(){const p=$('#pal');PAL.forEach(([n,c],k)=>{const d=document.createElement('div');d.className='sw';d.style.background=c;d.title=(k+1)+' '+n;d.innerHTML='<span class="n"></span>';d.onclick=()=>{cur=k;status();if(tool==='erase'||tool==='pick')setTool('pen')};p.appendChild(d)})}
function setTool(t){tool=t;document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function pushUndo(){undo.push(grid.slice());if(undo.length>60)undo.shift()}
function at(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left)/r.width*N),y=Math.floor((e.clientY-r.top)/r.height*N);return x>=0&&y>=0&&x<N&&y<N?y*N+x:-1}
function apply(i){if(i<0)return false;if(tool==='pen'){const c=(smart&&target&&target[i]>=0)?target[i]:cur;if(smart&&target&&target[i]<0)return false;if(grid[i]===c)return false;grid[i]=c}else if(tool==='erase'){if(grid[i]<0)return false;grid[i]=-1}else return false;return true}
function fill(i){const from=grid[i],to=cur;if(from===to)return;const st=[i];while(st.length){const j=st.pop();if(grid[j]!==from)continue;grid[j]=to;const x=j%N,y=(j/N)|0;if(x>0)st.push(j-1);if(x<N-1)st.push(j+1);if(y>0)st.push(j-N);if(y<N-1)st.push(j+N)}}
let down=false,last=-1;
const PT=new Map();let gest=null,stroke=null;
const W$=$('#wrap');
W$.addEventListener('pointerdown',e=>{if(e.target.closest('#zoom,#ref'))return;try{W$.setPointerCapture(e.pointerId)}catch(_){}PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(PT.size===2){ // 第二根手指：取消刚开始的这一笔，进入拖动/缩放
  if(down&&stroke){grid=stroke;undo.pop();draw()}down=false;stroke=null;
  const [p,q]=[...PT.values()];gest={d:Math.hypot(p.x-q.x,p.y-q.y)||1,z:Z,mx:(p.x+q.x)/2,my:(p.y+q.y)/2,ox:OX,oy:OY};return}
 if(PT.size>2)return;
 const i=at(e);if(i<0)return;
 if(tool==='pick'){const v=grid[i]>=0?grid[i]:(target?target[i]:-1);if(v>=0){cur=v;setTool('pen');toast('取色：'+(v+1)+' '+PAL[v][0])}status();return}
 pushUndo();if(tool==='fill'){fill(i);draw();save();return}
 stroke=undo[undo.length-1];down=true;last=i;if(apply(i)){draw();buzz()}});
W$.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId))return;PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(gest&&PT.size>=2){const [p,q]=[...PT.values()];const d=Math.hypot(p.x-q.x,p.y-q.y),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
  OX=gest.ox;OY=gest.oy;Z=gest.z;zoomAt(gest.z*d/gest.d,gest.mx,gest.my);OX+=mx-gest.mx;OY+=my-gest.my;place();return}
 if(!down)return;const i=at(e);if(i===last)return;last=i;if(apply(i)){draw();buzz()}});
const up=e=>{PT.delete(e.pointerId);if(gest){if(PT.size<2){gest=null;layout()}return}if(down){down=false;if(stroke&&stroke.every((v,k)=>v===grid[k]))undo.pop();stroke=null;save()}};
W$.addEventListener('pointerup',up);W$.addEventListener('pointercancel',up);
$('#zin').onclick=()=>{const r=W$.getBoundingClientRect();zoomAt(Z*1.4,r.left+r.width/2,r.top+r.height/2);layout()};
$('#zout').onclick=()=>{const r=W$.getBoundingClientRect();zoomAt(Z/1.4,r.left+r.width/2,r.top+r.height/2);layout()};
$('#zfit').onclick=()=>{fitArt();layout()};
function buzz(){if(navigator.vibrate)try{navigator.vibrate(6)}catch(e){}}
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('#undo').onclick=()=>{if(undo.length){grid=undo.pop();status.done=false;draw();save()}};
$('#clear').onclick=()=>{if(grid.some(v=>v>=0)&&confirm('清空豆板？')){pushUndo();grid.fill(-1);status.done=false;draw();save()}};
$('#size').onchange=e=>{const n=+e.target.value;if(grid.some(v=>v>=0)&&!confirm('换豆板会清空，继续？')){e.target.value=N;return}mode='free';target=null;curPat=-1;newGrid(n);modeBtns();layout();save()};
function modeBtns(){$('#bPat').classList.toggle('on',mode==='pat');$('#bFree').classList.toggle('on',mode==='free');$('#size').value=N}
$('#bFree').onclick=()=>{if(mode==='free')return;if(grid.some(v=>v>=0)&&!confirm('切到自由模式？图案提示会去掉，豆子保留。'))return;mode='free';target=null;curPat=-1;modeBtns();draw();save()};
// 图案选择
function thumb(g,n){const c=document.createElement('canvas');c.width=c.height=n*4;const x=c.getContext('2d');x.fillStyle='#f4f4f2';x.fillRect(0,0,n*4,n*4);g.forEach((v,i)=>{if(v>=0){x.fillStyle=PAL[v][1];x.beginPath();x.arc((i%n)*4+2,((i/n)|0)*4+2,1.9,0,7);x.fill()}});return c}
$('#bPat').onclick=()=>{const c=$('#card');c.innerHTML='<h2>选一个图案</h2><div id="pick"></div><div class="row"><button class="btn" id="cx">取消</button></div>';
 PATS.forEach((p,i)=>{const d=document.createElement('div');d.appendChild(thumb(patGrid(i),p.n||16));d.append(p.name);d.onclick=()=>{startPat(i);closeM()};$('#pick').appendChild(d)});
 $('#cx').onclick=closeM;openM()};
function startPat(i){stopAuto();newGrid(PATS[i].n||16);target=patGrid(i);curPat=i;mode='pat';status.done=false;const f=target.find(v=>v>=0);if(f!=null)cur=f;modeBtns();layout();save();toast('照着淡色豆子拼，数字是色号')}
// 照片转豆
$('#bImg').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const n=29,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,n,n);const d=x.getImageData(0,0,n,n).data;const rgb=PAL.map(p=>[1,3,5].map(k=>parseInt(p[1].substr(k,2),16)));newGrid(n);target=new Array(n*n).fill(-1);
 for(let i=0;i<n*n;i++){if(d[i*4+3]<100)continue;let b=0,bd=1e9;rgb.forEach((c,k)=>{if(k===22)return;const dd=(c[0]-d[i*4])**2*.3+(c[1]-d[i*4+1])**2*.59+(c[2]-d[i*4+2])**2*.11;if(dd<bd){bd=dd;b=k}});target[i]=b}
 curPat=-1;mode='pat';status.done=false;modeBtns();layout();save();toast('照片已转成豆图，照着拼吧');URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);e.target.value=''};
// 熨烫
$('#iron').onclick=()=>{if(!grid.some(v=>v>=0)){toast('先放几颗豆子');return}
 const S=Math.min(560,N*20),k=S/N,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d');
 const card=$('#card');card.innerHTML='<h2><b>♨️</b>熨烫中…</h2>';card.appendChild(c);const row=document.createElement('div');row.className='row';card.appendChild(row);openM();
 const xs=grid.map((v,i)=>v>=0?(i%N):1e9),ys=grid.map((v,i)=>v>=0?((i/N)|0):1e9);let t=0;
 function frame(){t=Math.min(1,t+.025);x.fillStyle='#fff';x.fillRect(0,0,S,S);
  grid.forEach((v,i)=>{if(v<0)return;const gx=i%N,gy=(i/N)|0,cx=(gx+.5)*k,cy=(gy+.5)*k,R=k*(.46+.06*t),hole=k*.16*(1-.55*t);
   x.fillStyle=PAL[v][1];
   // 融化：圆角方块逐渐变方，和邻居连在一起
   const rr=R*(1-.6*t),half=R;x.beginPath();if(x.roundRect)x.roundRect(cx-half,cy-half,half*2,half*2,Math.max(0,rr));else x.arc(cx,cy,R,0,7);x.fill();
   if(hole>.5){x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.arc(cx,cy,hole,0,7);x.fill()}x.fillStyle='rgba(255,255,255,.25)';x.beginPath();x.arc(cx-R*.3,cy-R*.35,R*.18,0,7);x.fill()});
  // 熨斗
  if(t<1){const ix=t*S*1.2-S*.1;x.fillStyle='rgba(255,255,255,.35)';x.fillRect(0,0,ix,S);x.font=`${S*.18}px sans-serif`;x.textAlign='center';x.fillText('♨️',ix,S*.55);requestAnimationFrame(frame)}
  else{card.querySelector('h2').textContent=target&&status.done?'完美！作品完成 🎉':'作品完成 🎉';
   row.innerHTML='<button class="btn hot" id="sv">保存图片</button><button class="btn" id="bk">继续拼</button>';
   $('#sv').onclick=()=>{const a=document.createElement('a');a.download='拼豆作品.png';a.href=c.toDataURL('image/png');a.click();toast('已保存（手机可长按图片保存）')};$('#bk').onclick=closeM}}
 frame()};

$('#bSmart').onclick=()=>{smart=!smart;$('#bSmart').classList.toggle('on',smart);toast(smart?'智能笔开：随手涂都是对的颜色':'智能笔关：用选中的颜色')};
function stopAuto(){if(auto){clearInterval(auto);auto=null}$('#bAuto').textContent='▶ 自动拼';$('#bAuto').classList.remove('on')}
$('#bAuto').onclick=()=>{if(auto){stopAuto();save();return}
 if(!target){toast('自动拼要先选图案或照片转豆');return}
 // 先拿掉放错的，再按颜色一种种放（像真的拼豆一样）
 pushUndo();grid.forEach((v,i)=>{if(v>=0&&target[i]!==v)grid[i]=-1});
 const order=[];const cols=[...new Set(target.filter(t=>t>=0))];cols.forEach(c=>target.forEach((t,i)=>{if(t===c&&grid[i]!==t)order.push(i)}));
 if(!order.length){status.done=false;draw();return}
 $('#bAuto').textContent='⏸ 暂停';$('#bAuto').classList.add('on');let k=0;const per=Math.max(1,Math.ceil(order.length/120));
 auto=setInterval(()=>{for(let j=0;j<per&&k<order.length;j++,k++){const i=order[k];grid[i]=target[i];cur=target[i]}draw();if(k>=order.length){stopAuto();save()}},30)};

const refc=document.getElementById('refc'),rx=refc.getContext('2d');
function drawRef(){const R=$('#ref');if(!target){R.style.display='none';return}R.style.display='block';
 let x0=N,y0=N,x1=-1,y1=-1;target.forEach((v,i)=>{if(v>=0){const x=i%N,y=(i/N)|0;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}});if(x1<0){R.style.display='none';return}
 const n=Math.max(x1-x0+1,y1-y0+1),k=Math.max(4,Math.floor(400/n)),S=n*k;refc.width=refc.height=S;rx.fillStyle='#fff';rx.fillRect(0,0,S,S);
 const ox=x0-Math.floor((n-(x1-x0+1))/2),oy=y0-Math.floor((n-(y1-y0+1))/2);
 target.forEach((v,i)=>{if(v<0)return;const x=(i%N-ox)*k,y=(((i/N)|0)-oy)*k;rx.fillStyle=PAL[v][1];rx.fillRect(x,y,k,k);if(grid[i]===v){}});
 // 已拼好的打勾淡化不需要，画当前可视区域框
 const w=$('#wrap'),cc=FIT*Z/N,vx=(-OX)/cc-ox,vy=(-OY)/cc-oy,vw=w.clientWidth/cc,vh=w.clientHeight/cc;
 if(Z>1.05){rx.strokeStyle='#e0302e';rx.lineWidth=Math.max(3,k*.4);rx.strokeRect(vx*k,vy*k,vw*k,vh*k)}
 drawRef.map={ox,oy,n}}
$('#ref').onclick=e=>{const R=$('#ref');if(!R.classList.contains('big')){R.classList.add('big');$('#reft').textContent='点图跳到那里 · 点文字收起';return}
 if(e.target.id==='reft'){R.classList.remove('big');$('#reft').textContent='参考图 · 点我放大';return}
 const m=drawRef.map,r=refc.getBoundingClientRect(),gx=(e.clientX-r.left)/r.width*m.n+m.ox,gy=(e.clientY-r.top)/r.height*m.n+m.oy,w=$('#wrap'),cc=FIT*Z/N;
 if(Z<1.5){Z=Math.max(1,Math.min(5,26*N/FIT))}const c2=FIT*Z/N;OX=w.clientWidth/2-gx*c2;OY=w.clientHeight/2-gy*c2;layout()};
function openM(){$('#msk').classList.add('show')}function closeM(){$('#msk').classList.remove('show')}
$('#msk').onclick=e=>{if(e.target.id==='msk')closeM()};
// ⤢ 全屏 / ✕ 退出
$('#fs').onclick=()=>{const d=document;if(!d.fullscreenElement)(d.documentElement.requestFullscreen||d.documentElement.webkitRequestFullscreen||(()=>{})).call(d.documentElement);else d.exitFullscreen&&d.exitFullscreen()};
$('#quit').onclick=()=>{if(document.fullscreenElement){document.exitFullscreen();return}if(history.length>1)history.back();else location.href='/'};
buildPal();if(!load()){newGrid(29);mode='free'}status.done=!!(target&&target.some(t=>t>=0)&&target.every((t,i)=>t<0||grid[i]===t));modeBtns();setTool('pen');addEventListener('resize',layout);layout();
window.__bead={get grid(){return grid},get N(){return N},startPat,PAL};
